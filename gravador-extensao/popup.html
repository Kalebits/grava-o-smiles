<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body { width: 280px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; background: #0f0f10; color: #f4f4f5; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { margin: 0 0 10px; color: #a1a1aa; font-size: 13px; }
  button { width: 100%; padding: 9px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; font: inherit; cursor: pointer; }
  #alternar { font-weight: 600; background: #86efac; color: #04130a; border-color: #86efac; }
  #alternar.parar { background: #f87171; border-color: #f87171; color: #1f0808; }
  textarea { width: 100%; box-sizing: border-box; min-height: 56px; margin-bottom: 6px; border-radius: 8px; border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; font: inherit; padding: 6px; }
  .gravando { color: #f87171; font-weight: 600; }
</style>
</head>
<body>
  <h1>Gravador de Emissões MP</h1>
  <p id="estado"></p>
  <button id="alternar"></button>
  <button id="marcador">Marcar: começou outra emissão</button>
  <textarea id="nota" placeholder="Nota rápida (ex.: aqui sempre dá erro, eu faço…)"></textarea>
  <button id="salvar-nota">Salvar nota</button>
  <p>Nunca grava o que você digita. Os prints ficam só no seu computador (app Emissões MP).</p>
  <script src="popup.js"></script>
</body>
</html>
